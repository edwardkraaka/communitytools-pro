# php2shell lab — engagement-owned PHP matrix for CVE-2026-109618/109619.
# Adapted from php2shell-poc (github.com/ikow/php2shell-poc, MIT) at commit
# 31519e6d8a84dee1df1262961ed1bebb65accadd. LOOPBACK ONLY: every published
# port binds 127.0.0.1 — nothing here is reachable off-box.
services:
  php-fpm-vuln:
    # 8.2.34 = last vulnerable 8.2 (fix landed in 8.2.35). FPM + nginx front.
    image: php:8.2.34-fpm
    container_name: php2shell-fpm-vuln
    working_dir: /var/www/html
    volumes:
      - ./app/index.php:/var/www/html/index.php:ro
    # deterministic chain-E reproduction: exactly one worker so the stale
    # BG(unserialize) producer/consumer pair reuses the same process.
    command: >
      sh -c "echo 'pm.max_children = 1' >> /usr/local/etc/php-fpm.d/zz-lab.conf &&
             php-fpm -F"
    restart: unless-stopped
    networks: [labnet]

  nginx-fpm-vuln:
    image: nginx:1.27-alpine
    container_name: php2shell-nginx-vuln
    volumes:
      - ./app/index.php:/var/www/html/index.php:ro
      - ./nginx/fpm.conf:/etc/nginx/conf.d/default.conf:ro
    # talk to php-fpm-vuln over the labnet; publish loopback-only
    command: >
      sh -c "sed -i 's/php-fpm-vuln:9000/php-fpm-vuln:9000/' /etc/nginx/conf.d/default.conf &&
             ln -s /var/run /run || true; nginx -g 'daemon off;'"
    depends_on: [php-fpm-vuln]
    ports:
      - "127.0.0.1:18056:80"
    networks: [labnet]
    restart: unless-stopped

  php-fpm-patched:
    # 8.2.35 = first patched 8.2 — the negative control for tier 4.
    image: php:8.2.35-fpm
    container_name: php2shell-fpm-patched
    working_dir: /var/www/html
    volumes:
      - ./app/index.php:/var/www/html/index.php:ro
    command: >
      sh -c "echo 'pm.max_children = 1' >> /usr/local/etc/php-fpm.d/zz-lab.conf &&
             php-fpm -F"
    restart: unless-stopped
    networks: [labnet]

  nginx-fpm-patched:
    image: nginx:1.27-alpine
    container_name: php2shell-nginx-patched
    volumes:
      - ./app/index.php:/var/www/html/index.php:ro
      - ./nginx/fpm.conf:/etc/nginx/conf.d/default.conf:ro
    command: >
      sh -c "sed -i 's/php-fpm-vuln:9000/php-fpm-patched:9000/' /etc/nginx/conf.d/default.conf &&
             ln -s /var/run /run || true; nginx -g 'daemon off;'"
    depends_on: [php-fpm-patched]
    ports:
      - "127.0.0.1:18057:80"
    networks: [labnet]
    restart: unless-stopped

  php-mod-vuln:
    # 8.2.34 Apache mod_php — the zero-dependency chain-D surface.
    image: php:8.2.34-apache
    container_name: php2shell-mod-vuln
    volumes:
      - ./app/index.php:/var/www/html/index.php:ro
    ports:
      - "127.0.0.1:18058:80"
    networks: [labnet]
    restart: unless-stopped

networks:
  labnet:
    driver: bridge
