server {
    listen 80;
    server_name _;
    root /var/www/html;
    index index.php;

    location / {
        try_files $uri $uri/ =404;
    }

    location ~ \.php$ {
        fastcgi_pass php-fpm-vuln:9000;  # patched variant rewrites the host via sed
        fastcgi_index index.php;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME /var/www/html$fastcgi_script_name;
        # large body allowance so the tier-4 multipart is not cut by the proxy
        client_max_body_size 64m;
    }
}
